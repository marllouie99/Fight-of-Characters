name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'mobile-*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Android
        run: |
          npm run build:web -- --skip-zip
          rm -f dist/*.zip
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fight-of-characters-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA (Unsigned / AltStore Ready)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync iOS
        run: |
          npm run build:web -- --skip-zip
          rm -f dist/*.zip
          npx cap sync ios

      - name: Build Xcode Project (Unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA Archive
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -qr Fight-of-Characters.ipa Payload
          echo "✅ Fight-of-Characters.ipa packaged successfully!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fight-of-characters-ios-ipa
          path: build/Fight-of-Characters.ipa
          if-no-files-found: error
          retention-days: 30

  release-mobile:
    name: Publish Mobile Release (Fast Direct CDN)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: fight-of-characters-android-debug-apk
          path: release-android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: fight-of-characters-ios-ipa
          path: release-ios

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mobile-latest
          name: "Fight of Characters Mobile (iOS & Android)"
          body: |
            ## 📱 Fight of Characters Mobile Builds
            
            High-speed direct download links (served via GitHub Global CDN):
            - **iOS IPA (Unsigned / AltStore / Sideloadly)**: [Fight-of-Characters.ipa](https://github.com/marllouie99/Fight-of-Characters/releases/download/mobile-latest/Fight-of-Characters.ipa)
            - **Android APK (Debug)**: [app-debug.apk](https://github.com/marllouie99/Fight-of-Characters/releases/download/mobile-latest/app-debug.apk)
            
            *Direct files ready to sideload. No nested zip extraction required!*
          files: |
            release-android/*.apk
            release-ios/*.ipa
          prerelease: false
